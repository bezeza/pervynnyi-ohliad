name: Аудит задачі 18 — тимчасові браузерні вимірювання
concurrency:
  group: audit-18-lab
  cancel-in-progress: true
on:
  push:
    branches: [audit-18-lab]
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright axe-core
      - run: npx playwright install --with-deps chromium
      - run: node build.mjs
      - run: node tests/audit-browser-lite.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-18-browser-results
          path: audit-output/
          if-no-files-found: warn
