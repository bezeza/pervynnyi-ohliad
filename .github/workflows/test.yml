name: Перевірка
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Зібраний файл збігається з репозиторієм
        run: git diff --exit-code -- index.html pervynnyi-ohliad.html sw.js README.md
