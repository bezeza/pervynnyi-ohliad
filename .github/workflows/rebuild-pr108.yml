name: Temporary rebuild for PR 108
on:
  push:
    branches:
      - ui/context-actions-0.9.3.92
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - name: Commit generated build outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pervynnyi-ohliad.html pervynnyi-ohliad-prev.html sw.js README.md
          if ! git diff --cached --quiet; then
            git commit -m "Зібрати v0.9.3.93"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
